[phases.setup]
commands = [
  "echo 'Setup phase - install root deps if any'"
]

[phases.build]
commands = [
  # Install frontend deps and build
  "cd frontend && npm install && npm run build",
  # Install backend deps (without migrating/seeding)
  "cd ../server && npm install"
]

[phases.start]
commands = [
  # Start backend only
  "cd server && npm run start"
]

[metadata]
name = "huddle"
