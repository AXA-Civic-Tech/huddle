[phases.setup]
commands = [
  "echo Setting up environment..."
]

[phases.install]
commands = [
  "cd frontend && npm install",
  "cd server && npm install"
]

[phases.build]
commands = [
  "cd frontend && npm run build",
  "cd server && npm run build"
]

[phases.start]
commands = [
  "cd server && npm run start"
]

[env]
NODE_VERSION = "18"
